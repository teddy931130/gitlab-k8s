kind: playground
name: gitlab-k8s-lab
base: k8s-omni
title: GitLab CE on Kubernetes
description: A fresh multi-node kubeadm cluster that automatically deploys the disposable GitLab CE lab.
categories:
  - kubernetes
  - ci-cd
markdown: |
  This playground creates a fresh Kubernetes cluster from the official `k8s-omni` base and deploys the GitLab lab from this repository. No existing VM snapshots or external service credentials are used.

  Startup installs GitLab and can take a long time. The lab uses ephemeral storage and is for evaluation only. The cluster needs enough account resources for GitLab; platform resource limits can prevent GitLab from becoming ready.

  To access GitLab from your own machine, connect to the cluster using the iximiuz Labs kubeconfig and `labctl kube-proxy`, then run:

  ```sh
  kubectl -n gitlab get svc -o name | grep envoy-gitlab-gitlab-gw
  kubectl -n gitlab port-forward svc/<envoy-service-name> 8080:443
  ```

  Visit `https://gitlab.gitlab.local:8080` and map `gitlab.gitlab.local` to `127.0.0.1` in your local hosts file. The lab uses a self-signed certificate.

  The initial root password is in the `gitlab-gitlab-initial-root-password` Secret in namespace `gitlab`. See the repository README for retrieval and troubleshooting instructions.
playground:
  initConditions:
    values:
      - key: Container runtime
        default: containerd
        options:
          - containerd
      - key: Networking plugin
        default: flannel
        options:
          - flannel
  initTasks:
    init_dev_machine_30_deploy_gitlab:
      name: init_dev_machine_30_deploy_gitlab
      machine: dev-machine
      init: true
      user: root
      timeout_seconds: 7200
      needs:
        - init_dev_machine_10_place_kubeconfig
        - init_cplane_50_flannel
        - init_node1_40_join
        - init_node2_40_join
      conditions:
        - key: Container runtime
          value: containerd
        - key: Networking plugin
          value: flannel
      run: |-
        set -Eeuo pipefail
        export DEBIAN_FRONTEND=noninteractive

        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git make openssl python3 tar

        HELM_VERSION=v4.3.1
        case "$(uname -m)" in
          x86_64) HELM_ARCH=amd64 ;;
          aarch64) HELM_ARCH=arm64 ;;
          *)
            echo "Unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        HELM_ARCHIVE="helm-${HELM_VERSION}-linux-${HELM_ARCH}.tar.gz"
        HELM_URL="https://get.helm.sh/${HELM_ARCHIVE}"
        HELM_TMP="$(mktemp -d)"
        trap 'rm -rf "$HELM_TMP"' EXIT
        curl --fail --silent --show-error --location "$HELM_URL" --output "$HELM_TMP/$HELM_ARCHIVE"
        curl --fail --silent --show-error --location "${HELM_URL}.sha256sum" --output "$HELM_TMP/$HELM_ARCHIVE.sha256sum"
        (cd "$HELM_TMP" && sha256sum --check "$HELM_ARCHIVE.sha256sum")
        tar -xzf "$HELM_TMP/$HELM_ARCHIVE" -C "$HELM_TMP"
        install "$HELM_TMP/linux-${HELM_ARCH}/helm" /usr/local/bin/helm
        rm -rf "$HELM_TMP"
        trap - EXIT

        kubectl wait --for=condition=Ready nodes --all --timeout=10m

        git clone --depth 1 --branch main https://github.com/teddy931130/gitlab-k8s.git /opt/gitlab-k8s
        chown -R laborant:laborant /opt/gitlab-k8s

        kubectl create namespace gitlab --dry-run=client -o yaml | kubectl apply -f -
        SECRET_DIR="$(mktemp -d)"
        chmod 700 "$SECRET_DIR"
        trap 'rm -rf "$SECRET_DIR"' EXIT
        openssl rand -hex 32 > "$SECRET_DIR/postgresql-password"
        openssl rand -hex 32 > "$SECRET_DIR/gitaly-token"
        kubectl create secret generic gitlab-postgresql-password \
          --namespace gitlab \
          --from-file=password="$SECRET_DIR/postgresql-password" \
          --dry-run=client -o yaml | kubectl apply -f -
        kubectl create secret generic gitlab-gitaly-token \
          --namespace gitlab \
          --from-file=token="$SECRET_DIR/gitaly-token" \
          --dry-run=client -o yaml | kubectl apply -f -
        rm -rf "$SECRET_DIR"
        trap - EXIT

        KUBECONFIG=/root/.kube/config make -C /opt/gitlab-k8s deploy-lab
  accessControl:
    canList:
      - owner
    canRead:
      - owner
    canStart:
      - owner
