        		--values $(EXAMPLE_VALUES) \
        		> /dev/null
        	helm template $(RELEASE) $(CHART) \
        		--version "$(CHART_VERSION)" \
        		--namespace "$(NAMESPACE)" \
        		--values $(BASE_VALUES) \
        		--values $(LAB_VALUES) \
