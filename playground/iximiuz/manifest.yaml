              containers:
                - name: rustfs
                  image: rustfs/rustfs:1.0.4
                  args:
                    - /data
                  env:
                    - name: RUSTFS_ACCESS_KEY
                      valueFrom:
                        secretKeyRef:
                          name: gitlab-minio-auth
                          key: root-user
                    - name: RUSTFS_SECRET_KEY
                      valueFrom:
                        secretKeyRef:
                          name: gitlab-minio-auth
                          key: root-password
                    - name: RUSTFS_ADDRESS
                      value: ":9000"
                    - name: RUSTFS_CONSOLE_ADDRESS
                      value: ":9001"
                    - name: RUSTFS_CONSOLE_ENABLE
                      value: "true"
                  ports:
                    - name: api
                      containerPort: 9000
                    - name: console
                      containerPort: 9001
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: api
                    initialDelaySeconds: 5
                    periodSeconds: 5
                  resources:
                    requests:
                      cpu: 100m
                      memory: 256Mi
                    limits:
                      memory: 512Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    runAsNonRoot: true
                    capabilities:
                      drop:
                        - ALL
                  volumeMounts:
                    - name: data
                      mountPath: /data
              volumes:
                - name: data
                  emptyDir: {}
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: gitlab-minio
          namespace: gitlab
        spec:
          selector:
            app: gitlab-minio
          ports:
            - name: api
              port: 9000
              targetPort: api
            - name: console
              port: 9001
              targetPort: console
      machines:
        - "dev-machine"
    -
      path: "/opt/gitlab-k8s/k8s/lab/object-storage-buckets.yaml"
      owner: "root"
      mode: "644"
      content: |
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: gitlab-object-storage-buckets
          namespace: gitlab
        spec:
          backoffLimit: 5
          template:
            spec:
              restartPolicy: OnFailure
              containers:
                - name: create-buckets
                  image: amazon/aws-cli:2.39.3
                  command:
                    - /bin/sh
                    - -c
                  args:
                    - |
                      set -eu
                      export AWS_DEFAULT_REGION=us-east-1
                      export AWS_EC2_METADATA_DISABLED=true
                      for bucket in gitlab-artifacts gitlab-lfs gitlab-uploads gitlab-packages gitlab-backups gitlab-backups-tmp gitlab-registry; do
                        if ! aws --endpoint-url "$S3_ENDPOINT" s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
                          aws --endpoint-url "$S3_ENDPOINT" s3api create-bucket --bucket "$bucket"
                        fi
                      done
                  env:
                    - name: AWS_ACCESS_KEY_ID
                      valueFrom:
                        secretKeyRef:
                          name: gitlab-minio-auth
                          key: root-user
                    - name: AWS_SECRET_ACCESS_KEY
                      valueFrom:
                        secretKeyRef:
                          name: gitlab-minio-auth
                          key: root-password
                    - name: S3_ENDPOINT
                      value: http://gitlab-minio.gitlab.svc.cluster.local:9000
                  resources:
                    requests:
                      cpu: 50m
                      memory: 128Mi
                    limits:
                      memory: 256Mi
      machines:
        - "dev-machine"
    -
      path: "/opt/gitlab-k8s/playground/iximiuz/gitlab-web.yaml"
      owner: "root"
      mode: "644"
      content: |
        # Serves GitLab to the playground's GitLab tab on NodePort 30080.
        #
        # The tab cannot use the HTTPS Gateway: Envoy only routes gitlab.gitlab.local,
        # while the browser reaches the playground at its own iximiuz hostname. This
        # proxy sends tab traffic to Workhorse and makes GitLab independent of the
        # hostname the iximiuz proxy forwards:
        #   - X-Forwarded-Proto is https, because the browser always uses HTTPS.
        #   - Origin is set to the forwarded host, so the Rails origin check passes.
        #     The CSRF authenticity token is still required.
        #   - Absolute redirects become relative, so they stay on the tab's hostname
        #     instead of going to gitlab.gitlab.local or the VM address.
        # This is only for the disposable playground; do not use it in production.
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: gitlab-playground-web
          namespace: gitlab
        data:
          default.conf: |
            map $http_x_forwarded_host $public_host {
              ""      $http_host;
              default $http_x_forwarded_host;
            }

            map $http_upgrade $connection_upgrade {
              default upgrade;
              ""      close;
            }

            server {
              listen 8080;
              client_max_body_size 0;
              # Keep rewritten redirects relative instead of nginx's own scheme and port.
              absolute_redirect off;

              location / {
                proxy_pass http://gitlab-webservice-default.gitlab.svc:8181;
                proxy_http_version 1.1;
                proxy_set_header Host $public_host;
                proxy_set_header X-Forwarded-Host $public_host;
                proxy_set_header X-Forwarded-Proto https;
                proxy_set_header X-Forwarded-Ssl on;
                proxy_set_header X-Forwarded-Port "";
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header Origin https://$public_host;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_redirect ~^https?://[^/]+(/.*)$ $1;
                proxy_buffering off;
                proxy_request_buffering off;
                proxy_read_timeout 300s;
              }
            }
        ---
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: gitlab-playground-web
          namespace: gitlab
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: gitlab-playground-web
          template:
            metadata:
              labels:
                app: gitlab-playground-web
            spec:
              securityContext:
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              containers:
                - name: nginx
                  image: nginxinc/nginx-unprivileged:1.30.6-alpine
                  ports:
                    - name: http
                      containerPort: 8080
                  readinessProbe:
                    tcpSocket:
                      port: http
                    periodSeconds: 5
                  resources:
                    requests:
                      cpu: 10m
                      memory: 16Mi
                    limits:
                      memory: 64Mi
                  securityContext:
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
                  volumeMounts:
                    - name: config
                      mountPath: /etc/nginx/conf.d
                      readOnly: true
              volumes:
                - name: config
                  configMap:
                    name: gitlab-playground-web
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: gitlab-playground-web
          namespace: gitlab
        spec:
          type: NodePort
          selector:
            app: gitlab-playground-web
          ports:
            - name: http
              port: 8080
              targetPort: http
              nodePort: 30080
      machines:
        - "dev-machine"
  tabs:
    -
      id: "terminal-dev-machine"
      kind: "terminal"
      name: "dev-machine"
      machine: "dev-machine"
    -
      id: "gitlab"
      kind: "http-port"
      name: "GitLab"
      machine: "cplane-01"
      number: 30080
      target: "window"
    -
      id: "ide-dev-machine"
      kind: "ide"
      name: "IDE"
      machine: "dev-machine"
    -
      id: "kexp-dev-machine"
      kind: "kexp"
      name: "Explorer"
      machine: "dev-machine"
    -
      id: "terminal-cplane-01"
      kind: "terminal"
      name: "cplane-01"
      machine: "cplane-01"
    -
      id: "terminal-node-01"
      kind: "terminal"
      name: "node-01"
      machine: "node-01"
    -
      id: "terminal-node-02"
      kind: "terminal"
      name: "node-02"
      machine: "node-02"
  initTasks:
    init_cplane_10_containerd_install:
      machine: "cplane-01"
      init: true
      user: "root"
      timeout_seconds: 300
      run: |
        mv /opt/iximiuz-labs/containerd/containerd.service /etc/systemd/system/containerd.service

        chmod +x /opt/iximiuz-labs/containerd/bin/*
        mv /opt/iximiuz-labs/containerd/bin/* /usr/local/bin

        mkdir -p /etc/containerd
        cat <<EOF > /etc/containerd/config.toml
        version = 2

        [plugins."io.containerd.grpc.v1.cri"]
          [plugins."io.containerd.grpc.v1.cri".containerd]
            snapshotter = "overlayfs"
            default_runtime_name = "runc"
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
            runtime_type = "io.containerd.runc.v2"
          [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
            SystemdCgroup = true
        [plugins."io.containerd.grpc.v1.cri".cni]
          bin_dir = "/opt/cni/bin"
          conf_dir = "/etc/cni/net.d"
        EOF

        systemctl daemon-reload
        systemctl enable --now containerd
    init_cplane_15_containerd_load_images:
      machine: "cplane-01"
      init: true
      user: "root"
      timeout_seconds: 300
      needs:
        - "init_cplane_10_containerd_install"
      run: |
        for i in $(ls /opt/iximiuz-labs/images); do
          ctr -n k8s.io images import "/opt/iximiuz-labs/images/$i"
        done

        rm -rf /opt/iximiuz-labs/images
    init_cplane_20_kubeadm_init:
      machine: "cplane-01"
      init: true
      user: "root"
      timeout_seconds: 300
      needs:
        - "init_cplane_15_containerd_load_images"
      run: |
        kubeadm init --pod-network-cidr=10.244.0.0/16
    init_cplane_30_place_kubeconfig:
      machine: "cplane-01"
      init: true
      user: "root"
      timeout_seconds: 300
      needs:
        - "init_cplane_20_kubeadm_init"
      run: |
        mkdir /root/.kube
        ln -s /etc/kubernetes/admin.conf /root/.kube/config

        mkdir /home/laborant/.kube
        cp /etc/kubernetes/admin.conf /home/laborant/.kube/config
        chown -R laborant:laborant /home/laborant/.kube
    init_cplane_40_taint:
      machine: "cplane-01"
      init: true
      user: "root"
      timeout_seconds: 300
      needs:
        - "init_cplane_30_place_kubeconfig"
      run: |
        kubectl taint node cplane-01 node-role.kubernetes.io/control-plane:NoSchedule-
    init_cplane_50_flannel:
      machine: "cplane-01"
      init: true
      user: "root"
      timeout_seconds: 300
      needs:
        - "init_cplane_40_taint"
      run: |
        kubectl apply -f https://github.com/flannel-io/flannel/releases/download/v0.28.10/kube-flannel.yml
    init_node1_10_containerd_install:
      machine: "node-01"
      init: true
      user: "root"
