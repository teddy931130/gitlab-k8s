# Serves GitLab to the playground's GitLab tab on NodePort 30080.
#
# The tab cannot use the HTTPS Gateway: Envoy only routes gitlab.gitlab.local,
# while the browser reaches the playground at its own iximiuz hostname. This
# proxy sends tab traffic to Workhorse and makes GitLab independent of the
# hostname the iximiuz proxy forwards:
#   - X-Forwarded-Proto is https, because the browser always uses HTTPS.
#   - Origin is set to the forwarded host, so the Rails origin check passes.
#     The CSRF authenticity token is still required.
#   - Absolute redirects become relative, so they stay on the tab's hostname
#     instead of going to gitlab.gitlab.local or the VM address.
# This is only for the disposable playground; do not use it in production.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitlab-playground-web
  namespace: gitlab
data:
  default.conf: |
    map $http_x_forwarded_host $public_host {
      ""      $http_host;
      default $http_x_forwarded_host;
    }

    map $http_upgrade $connection_upgrade {
      default upgrade;
      ""      close;
    }

    server {
      listen 8080;
      client_max_body_size 0;
      # Keep rewritten redirects relative instead of nginx's own scheme and port.
      absolute_redirect off;

      location / {
        proxy_pass http://gitlab-webservice-default.gitlab.svc:8181;
        proxy_http_version 1.1;
        proxy_set_header Host $public_host;
        proxy_set_header X-Forwarded-Host $public_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        proxy_set_header X-Forwarded-Port "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin https://$public_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-playground-web
  namespace: gitlab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-playground-web
  template:
    metadata:
      labels:
        app: gitlab-playground-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.30.6-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: gitlab-playground-web
---
apiVersion: v1
kind: Service
metadata:
  name: gitlab-playground-web
  namespace: gitlab
spec:
  type: NodePort
  selector:
    app: gitlab-playground-web
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
