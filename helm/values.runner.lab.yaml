# Standalone runner for the disposable iximiuz playground.
# The authentication token is created at startup in the runner namespace.
gitlabUrl: http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/
concurrent: 1
checkInterval: 5

serviceAccount:
  create: true

rbac:
  create: true
  clusterWideAccess: false
  rules:
    - resources: [pods]
      verbs: [create, delete, get, list, watch]
    - resources: [pods/attach, pods/exec]
      verbs: [create, delete, get, patch]
    - resources: [pods/log]
      verbs: [get, list]
    - resources: [secrets]
      verbs: [create, delete, get, update]
    - resources: [serviceaccounts]
      verbs: [get]
    - resources: [services]
      verbs: [create, get]

runners:
  secret: lab-runner-auth
  locked: null
  config: |
    [[runners]]
      clone_url = "http://gitlab-webservice-default.gitlab.svc.cluster.local:8181"
      request_concurrency = 2
      [runners.kubernetes]
        namespace = "runner"
        image = "alpine:3.22"
        privileged = false
        cpu_request = "100m"
        cpu_limit = "500m"
        memory_request = "128Mi"
        memory_limit = "512Mi"
        helper_cpu_request = "50m"
        helper_cpu_limit = "250m"
        helper_memory_request = "128Mi"
        helper_memory_limit = "256Mi"

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
