global:
  edition: ce
  hosts:
    domain: gitlab.local
    https: true
  gatewayApi:
    enabled: true
    installEnvoy: true
    configureEnvoy: true
    configureCertmanager: false
    httpToHttpsRedirect: false
  ingress:
    enabled: false
    configureCertmanager: false
  psql:
    host: gitlab-postgresql.gitlab.svc.cluster.local
    port: 5432
    username: gitlab
    password:
      secret: gitlab-postgresql-password
      key: password
    main:
      database: gitlabhq_production
    ci:
      database: gitlabhq_production
      databaseTasks: false
  redis:
    host: gitlab-redis.gitlab.svc.cluster.local
    port: 6379
    auth:
      enabled: false
  gitaly:
    enabled: true
    authToken:
      secret: gitlab-gitaly-token
      key: token
  rails:
    bootsnap:
      enabled: false
  appConfig:
    object_store:
      enabled: true
    artifacts:
      enabled: true
      bucket: gitlab-artifacts
    lfs:
      enabled: true
      bucket: gitlab-lfs
    uploads:
      enabled: true
      bucket: gitlab-uploads
    packages:
      enabled: true
      bucket: gitlab-packages
    backups:
      bucket: gitlab-backups
      tmpBucket: gitlab-backups-tmp
  registry:
    bucket: gitlab-registry

installCertmanager: false

nginx-ingress:
  enabled: false

prometheus:
  install: true
  server:
    retention: 24h
    persistentVolume:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

gitlab-runner:
  install: false

registry:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

gitlab:
  webservice:
    minReplicas: 1
    resources:
      limits:
        memory: 2500M
      requests:
        cpu: 100m
        memory: 1500M
    workhorse:
      resources:
        limits:
          memory: 100M
        requests:
          cpu: 10m
          memory: 10M
  sidekiq:
    minReplicas: 1
    resources:
      limits:
        memory: 1.5G
      requests:
        cpu: 50m
        memory: 625M
  gitlab-shell:
    minReplicas: 1
  gitaly:
    persistence:
      enabled: false
  toolbox:
    enabled: false

gatewayApiResources:
  gateway:
    protocol: HTTPS
    tls:
      secretName: gitlab-wildcard-tls
  envoy:
    proxySpec:
      provider:
        kubernetes:
          envoyService:
            type: NodePort
